<!doctype html>
<html lang="ru">
<head>
    <!-- Мета-теги структуры документа и адаптивного масштабирования страницы -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Базовая адаптивная сетка и утилиты Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Консольный моноширинный шрифт Cascadia Mono с поддержкой кириллицы -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-mono@5.0.1/index.css">

    <!-- Главная таблица стилей проекта с версионным параметром для сброса кэша браузера -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=30">

    <title>{% block title %}Burmalda{% endblock %}</title>
    {% block head %}{% endblock %}
</head>
<body class="site-body">
    <!-- Двухколоночный макет сайта: фиксированное меню слева и рабочий холст справа -->
    <div class="site-layout">

        <!-- Боковая навигационная консоль сайта -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <!-- Контейнер логотипа сайта со ссылкой на главную страницу -->
                <div class="sidebar-logo">
                    <a href="{{ url_for('main_page') }}" class="d-inline-flex text-decoration-none">
                        <img class="header__image" src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
                    </a>
                </div>

                <!-- Вертикальный список навигационных разделов и игр платформы -->
                <nav class="sidebar-nav">
                    <a href="{{ url_for('main_page') }}" class="sidebar-link">Главная</a>
                    <a href="{{ url_for('rocket') }}" class="sidebar-link">Ракетка</a>
                    <a href="{{ url_for('slots') }}" class="sidebar-link">Слоты</a>
                    <a href="{{ url_for('zachet.index') }}" class="sidebar-link">Апгрейдер</a>
                    <a href="{{ url_for('double.index') }}" class="sidebar-link">Double</a>
                    <a href="{{ url_for('vorona_combat') }}" class="sidebar-link">Ворона КОМБАТ</a>
                </nav>
            </div>

            <!-- Нижняя панель авторизации и управления профилем игрока -->
            <div class="sidebar-bottom">
                {% if current_user %}
                    <!-- Информационный блок авторизованного пользователя -->
                    <div class="user-info-box">
                        <a href="{{ url_for('profile') }}" class="user-email" title="{{ current_user }}">{{ current_user }}</a>
                        <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
                    </div>
                {% else %}
                    <!-- Блок кнопок входа и регистрации для гостей -->
                    <div class="guest-auth-box">
                        <a href="{{ url_for('login') }}" class="btn btn-login w-100">Войти</a>
                        <a href="{{ url_for('register') }}" class="btn btn-primary-custom w-100">Регистрация</a>
                    </div>
                {% endif %}
            </div>
        </aside>

        <!-- Правая область отображения шапки и динамического содержимого страниц -->
        <div class="main-wrapper">
            <!-- Верхняя строка страницы с текущим балансом пользователя -->
            <header class="top-bar">
                {% if current_user %}
                    <div class="balance-corner">
                        <span id="header-balance">{{ current_balance }}</span> 🪙
                    </div>
                {% endif %}
            </header>

            <!-- Контейнер подстановки шаблонов страниц через Jinja2 -->
            <main class="page-content">
                {% block body %}{% endblock %}
            </main>
        </div>

    </div>

    <!-- Библиотека клиентских скриптов Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Блок скриптов конкретной страницы -->
    {% block scripts %}{% endblock %}
</body>
</html>
